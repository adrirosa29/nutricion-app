  {

    name: "Bowl de salmón y patata",

      { name: "Salmón ahumado", grams: 60, kcalPer100: 171 },

const gastoCategorias = [

  { name: "Lácteos y huevos", pct: 18, color: "#C7A24A" },

function pad(n) {
  return String(n).padStart(2, "0");
}
function toKey(date) {
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}
const TODAY = new Date(2026, 8, 4); // 4 sept 2026, ancla de la demo

function Ticket({ children }) {
  return (
    <div className="relative w-full" style={{ background: palette.paper, color: palette.ink, boxShadow: "0 18px 40px rgba(36,31,22,0.28)" }}>
      <div style={{ borderTop: `2px dashed ${palette.line}` }} />
      {children}
      <div style={{ borderBottom: `2px dashed ${palette.line}` }} />
    </div>
  );
}

function Row({ left, right, sub, muted }) {
  return (
    <div className="flex items-baseline justify-between py-1.5" style={{ opacity: muted ? 0.55 : 1 }}>
      <div className="pr-2">
        <div className="text-[13.5px] leading-tight">{left}</div>
        {sub && <div className="text-[11px]" style={{ color: palette.inkSoft }}>{sub}</div>}
      </div>
      <div className="flex-1 border-b border-dotted mx-1 mb-1" style={{ borderColor: palette.line }} />
      {right !== undefined && (
        <div className="text-[13px] whitespace-nowrap pl-3 text-right" style={{ fontFamily: "'Courier New', monospace", minWidth: 58 }}>
          {right}
        </div>
      )}
    </div>
  );
}

function Stamp({ children, tone = "ink" }) {
  const colors = {
    ink: { bg: "transparent", fg: palette.ink, bd: palette.ink },
    red: { bg: palette.redSoft, fg: palette.red, bd: palette.red },
    green: { bg: palette.greenSoft, fg: palette.green, bd: palette.green },
  }[tone];
  return (
    <span className="inline-block px-1.5 py-0.5 text-[10px] tracking-wide uppercase" style={{ color: colors.fg, border: `1px solid ${colors.bd}`, background: colors.bg, transform: "rotate(-1.5deg)" }}>
      {children}
    </span>
  );
}

function SectionTitle({ children, right }) {
  return (
    <div className="flex items-baseline justify-between text-[12px] tracking-[0.14em] uppercase mb-2 pb-1" style={{ color: palette.inkSoft, borderBottom: `1px solid ${palette.line}` }}>
      <span>{children}</span>
      {right && <span style={{ fontFamily: "'Courier New', monospace", color: palette.ink }}>{right}</span>}
    </div>
  );
}

// ---------- Calendario reutilizable ----------
function MiniCalendar({ selected, onSelect, dataKeys }) {
  const [viewMonth, setViewMonth] = useState(new Date(selected.getFullYear(), selected.getMonth(), 1));
  const monthLabel = viewMonth.toLocaleDateString("es-ES", { month: "long", year: "numeric" });
  const firstWeekday = (viewMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(viewMonth.getFullYear(), viewMonth.getMonth(), d));

  return (
    <div className="px-5 pb-3">
      <div className="flex items-center justify-between mb-2">
        <button onClick={() => setViewMonth(new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1))} className="text-[13px] px-2">‹</button>
        <span className="text-[12px] uppercase tracking-wide" style={{ color: palette.inkSoft }}>{monthLabel}</span>
        <button onClick={() => setViewMonth(new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1))} className="text-[13px] px-2">›</button>
      </div>
      <div className="grid grid-cols-7 gap-1 text-center">
        {["L", "M", "X", "J", "V", "S", "D"].map((d, i) => (
          <div key={i} className="text-[10px]" style={{ color: palette.inkSoft }}>{d}</div>
        ))}
        {cells.map((date, idx) => {
          if (!date) return <div key={idx} />;
          const key = toKey(date);
          const isSelected = key === toKey(selected);
          const isToday = key === toKey(TODAY);
          const isFuture = date > TODAY;
          const dayData = dataKeys[key];
          const kcal = dayData
            ? MEALS.reduce((s, m) => s + (dayData[m] || []).reduce((s2, i) => s2 + i.kcal, 0), 0)
            : null;
          return (
            <button
              key={idx}
              onClick={() => onSelect(date)}
              className="text-[11.5px] flex flex-col items-center justify-center relative py-1"
              style={{
                minHeight: 40,
                background: isSelected ? palette.ink : "transparent",
                color: isSelected ? palette.paper : isFuture ? palette.inkSoft : palette.ink,
                border: isToday && !isSelected ? `1px solid ${palette.ink}` : "1px solid transparent",
              }}
            >
              <span>{date.getDate()}</span>
              <span
                className="text-[8.5px] leading-none mt-0.5"
                style={{
                  fontFamily: "'Courier New', monospace",
                  color: isSelected ? palette.paper : kcal !== null ? palette.green : palette.line,
                }}
              >
                {kcal !== null ? kcal : "·"}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function dayLabel(date) {
  const key = toKey(date);
  if (key === toKey(TODAY)) return "Hoy";
  const diff = Math.round((date - TODAY) / 86400000);
  const fecha = date.toLocaleDateString("es-ES", { day: "numeric", month: "short" });
  if (diff === -1) return `Ayer · ${fecha}`;
  if (diff === 1) return `Mañana · ${fecha}`;
  return fecha;
}

function DayBreakdown({ date }) {
  const key = toKey(date);
  const dayData = mockDiary[key] || Object.fromEntries(MEALS.map((m) => [m, []]));
  const isFuture = date > TODAY;
  const hasAny = MEALS.some((m) => dayData[m].length);
  const total = MEALS.reduce((s, m) => s + dayData[m].reduce((s2, i) => s2 + i.kcal, 0), 0);

  return (
    <div className="px-5">
      {isFuture && (
        <div className="mb-3 p-2.5 text-[12px]" style={{ background: palette.greenSoft, border: `1px dashed ${palette.green}`, color: palette.ink }}>
          Día futuro: planifica añadiendo recetas o productos.
        </div>
      )}
      {!isFuture && !hasAny && (
        <div className="mb-3 text-[12px]" style={{ color: palette.inkSoft }}>
          No hay registros guardados este día.
        </div>
      )}
      {MEALS.map((meal) => {
        const items = dayData[meal];
        const subtotal = items.reduce((s, i) => s + i.kcal, 0);
        return (
          <div key={meal} className="mb-3">
            <SectionTitle right={items.length ? `${subtotal} kcal` : undefined}>{meal}</SectionTitle>
            {items.length === 0 ? (
              <button className="w-full text-left text-[12px] py-1.5" style={{ color: palette.inkSoft }}>
                + Añadir a {meal.toLowerCase()}
              </button>
            ) : (
              items.map((it, idx) => <Row key={idx} left={it.name} sub={it.qty} right={`${it.kcal} kcal`} />)
            )}
          </div>
        );
      })}
      <div className="flex items-center justify-between pt-3 mt-1" style={{ borderTop: `2px solid ${palette.ink}` }}>
        <span className="text-[13px] uppercase tracking-wide">Total día</span>
        <span className="text-[22px] font-bold" style={{ fontFamily: "'Courier New', monospace", color: palette.red }}>{total} kcal</span>
      </div>
      <div className="flex gap-2 mt-3 mb-5">
        <Stamp tone="green">62% fresco</Stamp>
        <Stamp tone="red">38% procesado</Stamp>
      </div>
    </div>
  );
}

// ---------- Recetas ----------
function RecetaDetalle({ recipe, onBack }) {
  const [grams, setGrams] = useState(Object.fromEntries(recipe.ingredients.map((i) => [i.name, i.grams])));
  const total = recipe.ingredients.reduce((s, i) => s + (grams[i.name] / 100) * i.kcalPer100, 0);
  return (
    <Ticket>
      <div className="px-5 pt-5 pb-3">
        <button onClick={onBack} className="text-[11px] uppercase tracking-wide mb-2" style={{ color: palette.inkSoft }}>‹ Volver a recetas</button>
        <div className="text-[19px] font-semibold">{recipe.name}</div>
        <div className="text-[11px]" style={{ color: palette.inkSoft }}>{recipe.meal} · {recipe.servings} raciones</div>
      </div>
      <div className="px-5">
        <SectionTitle>Ingredientes (edita la cantidad de hoy)</SectionTitle>
        {recipe.ingredients.map((i, idx) => (
          <div key={idx} className="flex items-center justify-between py-1.5">
            <div className="text-[13.5px] flex-1">{i.name}</div>
            <input
              type="number"
              value={grams[i.name]}
              onChange={(e) => setGrams((g) => ({ ...g, [i.name]: Number(e.target.value) || 0 }))}
              className="w-16 text-right px-1 py-0.5 mr-1"
              style={{ fontFamily: "'Courier New', monospace", border: `1px solid ${palette.line}`, background: palette.paperDark, color: palette.ink }}
            />
            <span className="text-[12px] w-6" style={{ color: palette.inkSoft }}>g</span>
            <span className="text-[13px] text-right pl-3" style={{ fontFamily: "'Courier New', monospace", minWidth: 66 }}>
              {Math.round((grams[i.name] / 100) * i.kcalPer100)} kcal
            </span>
          </div>
        ))}
        <div className="flex items-center justify-between pt-3 mt-2" style={{ borderTop: `2px solid ${palette.ink}` }}>
          <span className="text-[13px] uppercase tracking-wide">Total (esta ración)</span>
          <span className="text-[20px] font-bold" style={{ fontFamily: "'Courier New', monospace", color: palette.red }}>{Math.round(total)} kcal</span>
        </div>
        <div className="text-[11px] mt-2 mb-5" style={{ color: palette.inkSoft }}>
          Los cambios de hoy no afectan a la receta guardada, salvo que pulses "Actualizar receta".
        </div>
      </div>
    </Ticket>
  );
}

function RecetasTab() {
  const [open, setOpen] = useState(null);
  const [expanded, setExpanded] = useState({});
  if (open) return <RecetaDetalle recipe={open} onBack={() => setOpen(null)} />;

  return (
    <Ticket>
      <div className="px-5 pt-5 pb-3 text-center">
        <div className="text-[11px] tracking-[0.2em] uppercase" style={{ color: palette.inkSoft }}>Tus recetas</div>
        <div className="text-[20px] font-semibold mt-1">{recipesSeed.length} guardadas</div>
      </div>
      <div className="px-5 pb-5">
        {MEALS.map((meal) => {
          const recipes = recipesSeed.filter((r) => r.meal === meal);
          const isOpen = !!expanded[meal];
          return (
            <div key={meal} style={{ borderBottom: `1px dotted ${palette.line}` }}>
              <button
                onClick={() => setExpanded((e) => ({ ...e, [meal]: !e[meal] }))}
                className="w-full flex items-center justify-between py-2.5"
              >
                <span className="text-[13px] uppercase tracking-wide">{meal}</span>
                <span className="text-[11px]" style={{ color: palette.inkSoft, fontFamily: "'Courier New', monospace" }}>
                  {recipes.length} {isOpen ? "▴" : "▾"}
                </span>
              </button>

              {isOpen && (
                <div className="pb-2">
                  {recipes.length === 0 ? (
                    <div className="text-[12px] pb-2" style={{ color: palette.inkSoft }}>Sin recetas todavía</div>
                  ) : (
                    recipes.map((r) => {
                      const total = r.ingredients.reduce((s, i) => s + (i.grams / 100) * i.kcalPer100, 0);
                      return (
                        <button key={r.id} onClick={() => setOpen(r)} className="w-full text-left py-1.5 flex items-baseline justify-between">
                          <span className="text-[13px]">{r.name}</span>
                          <span className="text-[12.5px] pl-2 whitespace-nowrap" style={{ fontFamily: "'Courier New', monospace" }}>{Math.round(total)} kcal</span>
                        </button>
                      );
                    })
                  )}
                  <button className="text-[11px] mt-1" style={{ color: palette.inkSoft }}>+ Nueva receta en {meal.toLowerCase()}</button>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </Ticket>
  );
}

    <Ticket>

        <div className="text-[11px] tracking-[0.2em] uppercase" style={{ color: palette.inkSoft }}>Gasto en el súper</div>
        <div className="text-[24px] font-bold mt-1" style={{ fontFamily: "'Courier New', monospace" }}>{gastoTotal.toFixed(2)}€</div>
        <div className="flex justify-center gap-1 mt-2">
          {["semana", "mes"].map((r) => (
            <button key={r} onClick={() => setRange(r)} className="px-3 py-1 text-[11px] uppercase tracking-wide" style={{ border: `1px solid ${palette.ink}`, background: range === r ? palette.ink : "transparent", color: range === r ? palette.paper : palette.ink }}>
              {r === "semana" ? "Esta semana" : "Este mes"}
            </button>
          ))}
        </div>
      </div>
      <div className="px-5">
        <SectionTitle>Por categoría</SectionTitle>
        <div className="flex h-3 w-full overflow-hidden mb-3" style={{ border: `1px solid ${palette.ink}` }}>
          {gastoCategorias.map((c, idx) => (
            <div key={idx} style={{ width: `${c.pct}%`, background: c.color }} />
          ))}
        </div>
        {gastoCategorias.map((c, idx) => (
          <div key={idx} className="flex items-center justify-between py-1.5">
            <div className="flex items-center gap-2">
              <span className="w-2.5 h-2.5 inline-block" style={{ background: c.color }} />
              <span className="text-[12.5px]">{c.name}</span>
            </div>
            <span className="text-[12.5px] whitespace-nowrap pl-2" style={{ fontFamily: "'Courier New', monospace" }}>
              {c.pct}% · {(gastoTotal * c.pct / 100).toFixed(2)}€
            </span>
          </div>
        ))}
        <div className="text-[11px] mt-3 mb-5" style={{ color: palette.inkSoft }}>
          Basado en el precio de cada producto de tus tickets, agrupado por tipo de alimento.
        </div>
      </div>
    </Ticket>
  );
}

// ---------- Selector de perfil: desplegable con nombres editables ----------
function ProfileDropdown({ profiles, setProfiles, current, onSelect }) {
  const [open, setOpen] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const currentLabel = profiles.find((p) => p.id === current)?.label;

  return (
    <div className="relative mb-3 w-full max-w-[220px] mx-auto">
      <button
        onClick={() => setOpen((v) => !v)}
        className="w-full flex items-center justify-between px-4 py-2"
        style={{ border: `2px solid ${palette.ink}`, background: palette.paper, color: palette.ink }}
      >
        <span className="text-[12px] uppercase tracking-wide">{currentLabel}</span>
        <span className="text-[11px]">{open ? "▴" : "▾"}</span>
      </button>

      {open && (
        <div className="absolute left-0 right-0 mt-1 z-10" style={{ background: palette.paper, border: `2px solid ${palette.ink}` }}>
          {profiles.map((p) => (
            <div
              key={p.id}
              className="flex items-center justify-between px-3 py-2"
              style={{ borderBottom: `1px dotted ${palette.line}`, background: p.id === current ? palette.paperDark : "transparent" }}
            >
              {editingId === p.id ? (
                <input
                  autoFocus
                  value={p.label}
                  onChange={(e) =>
                    setProfiles((prev) => prev.map((x) => (x.id === p.id ? { ...x, label: e.target.value } : x)))
                  }
                  onBlur={() => setEditingId(null)}
                  onKeyDown={(e) => e.key === "Enter" && setEditingId(null)}
                  className="text-[12px] flex-1 px-1 py-0.5 mr-2"
                  style={{ border: `1px solid ${palette.ink}`, background: palette.paperDark, color: palette.ink }}
                />
              ) : (
                <button
                  onClick={() => {
                    onSelect(p.id);
                    setOpen(false);
                  }}
                  className="text-[12px] flex-1 text-left"
                >
                  {p.label}
                </button>
              )}
              <button
                onClick={() => setEditingId(editingId === p.id ? null : p.id)}
                className="text-[12px] pl-2"
                style={{ color: palette.inkSoft }}
                title="Renombrar"
              >
                ✎
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const initialProfiles = [
  { id: "ti", label: "Ti" },
  { id: "novia", label: "Novia" },
];

function App() {
  const [tab, setTab] = useState("diario");
  const [profiles, setProfiles] = useState(initialProfiles);
  const [profileId, setProfileId] = useState("ti");
  const profileLabel = profiles.find((p) => p.id === profileId)?.label;

  return (
    <div className="w-full flex justify-center py-6" style={{ background: "#DCD5C4" }}>
      <div className="w-full max-w-[380px]">
        <ProfileDropdown profiles={profiles} setProfiles={setProfiles} current={profileId} onSelect={setProfileId} />

        <div className="px-1">
          {tab === "diario" && <DiarioTab profile={profileLabel} />}
          {tab === "calendario" && <CalendarioTab />}
          {tab === "ticket" && <EscanearTab />}
          {tab === "recetas" && <RecetasTab />}
          {tab === "resumen" && <ResumenTab />}
        </div>

        <div className="flex mt-3 overflow-hidden" style={{ border: `2px solid ${palette.ink}`, background: palette.paper }}>
          {TABS.map((t) => (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              className="flex-1 py-2.5 text-[11px] uppercase tracking-wide"
              style={{ background: tab === t.id ? palette.ink : "transparent", color: tab === t.id ? palette.paper : palette.ink, borderRight: `1px solid ${palette.line}` }}
            >
              {t.label}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
}
</script>
